<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Kepegawaian Kota Dumai</title>
    <!-- Memanggil Chart.js untuk Grafik -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; }
        .header { background-color: #ffffff; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #28a745; }
        .header h1 { margin: 0; color: #28a745; font-size: 24px; }
        .header .total-asn { text-align: right; }
        .header .total-asn h2 { margin: 0; color: #dc3545; font-size: 28px; }
        .nav { background-color: #28a745; padding: 10px 30px; color: white; display: flex; gap: 20px; font-weight: bold; font-size: 14px; }
        .container { padding: 20px 30px; }
        
        /* Kartu Ringkasan */
        .summary-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .card { padding: 20px; border-radius: 8px; color: white; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .card h3 { margin: 0; font-size: 16px; font-weight: normal; }
        .card h2 { margin: 10px 0 0; font-size: 32px; }
        .bg-blue { background-color: #4285f4; }
        .bg-yellow { background-color: #fbbc05; }
        .bg-green { background-color: #34a853; }
        .bg-red { background-color: #ea4335; }

        /* Grafik */
        .charts-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .chart-box { background-color: #1e1e1e; padding: 20px; border-radius: 8px; color: white; text-align: center; }
        .chart-box h4 { margin-top: 0; color: #ffffff; }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h1>DASHBOARD KEPEGAWAIAN</h1>
            <span style="color: #666; font-weight: bold;">PEMERINTAH KOTA DUMAI</span>
        </div>
        <div class="total-asn">
            <span style="color: #666; font-size: 14px; font-weight: bold;">Total Pegawai Tahun 2026</span>
            <h2>4.520</h2>
        </div>
    </div>

    <div class="nav">
        <span>🏠 Dashboard</span>
        <span>📊 Berdasarkan Pangkat</span>
        <span>📈 Berdasarkan Pendidikan</span>
    </div>

    <div class="container">
        <!-- Kartu Ringkasan -->
        <div class="summary-cards">
            <div class="card bg-blue">
                <div><h3>Total PNS</h3><h2>3.150</h2></div>
            </div>
            <div class="card bg-yellow">
                <div><h3>Total CPNS</h3><h2>120</h2></div>
            </div>
            <div class="card bg-green">
                <div><h3>Total PPPK</h3><h2>1.250</h2></div>
            </div>
            <div class="card bg-red">
                <div><h3>Total Honorer</h3><h2>0</h2></div>
            </div>
        </div>

        <!-- Area Grafik -->
        <div class="charts-container">
            <div class="chart-box">
                <h4>Data ASN Berdasarkan Jenis Kelamin</h4>
                <canvas id="genderChart"></canvas>
            </div>
            <div class="chart-box">
                <h4>Data Berdasarkan Jenis Jabatan</h4>
                <canvas id="jabatanChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // Grafik Jenis Kelamin (Donut Chart)
        const ctxGender = document.getElementById('genderChart').getContext('2d');
        new Chart(ctxGender, {
            type: 'doughnut',
            data: {
                labels: ['Laki-laki', 'Perempuan'],
                datasets: [{
                    data: [2100, 2420],
                    backgroundColor: ['#28a745', '#ff8c00'],
                    borderWidth: 0
                }]
            },
            options: { plugins: { legend: { labels: { color: 'white' } } } }
        });

        // Grafik Jenis Jabatan (Bar Chart)
        const ctxJabatan = document.getElementById('jabatanChart').getContext('2d');
        new Chart(ctxJabatan, {
            type: 'bar',
            data: {
                labels: ['Struktural', 'Pelaksana', 'Fungsional'],
                datasets: [{
                    label: 'Jumlah Pegawai',
                    data: [350, 1500, 2670],
                    backgroundColor: '#fbbc05'
                }]
            },
            options: { scales: { y: { ticks: { color: 'white' } }, x: { ticks: { color: 'white' } } }, plugins: { legend: { display: false } } }
        });
    </script>
</body>
</html>
